---
layout: default
title: "Новини — АБВ Книжарница"
nav: news
---

<!-- PAGE HEADER -->
<section class="position-relative d-flex flex-column justify-content-center text-center"
         style="min-height:28vh;background-image:url('{{ '/assets/images/hero.jpg' | relative_url }}');background-size:cover;background-position:center;">
  <div class="position-absolute top-0 start-0 w-100 h-100" style="background:rgba(0,0,0,.45)"></div>
  <div class="container position-relative">
    <h1 class="display-4 fw-bold">Новини</h1>
  </div>
</section>

<!-- NEWS LIST -->
<main class="bg-light text-dark py-5">
  <div class="container">

    {% for post in site.posts %}
    <article class="card rounded-4 shadow-sm mb-4">
      <div class="row g-0">
        <div class="col-md-4">
          <img class="news-thumb"
               src="{{ post.image | default: '/assets/images/gallery/1.jpg' | relative_url }}"
               alt="{{ post.title }}">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <small class="text-muted d-block mb-1">
              <i class="bi bi-calendar3 me-1"></i>{{ post.date | date: "%-d %B %Y" }}
            </small>
            <h3 class="h5 fw-bold mb-2">
              <a class="text-decoration-none text-dark" href="{{ post.url | relative_url }}">{{ post.title }}</a>
            </h3>
            <p class="mb-3 text-muted">{{ post.excerpt | strip_html | truncate: 160 }}</p>
            <a class="btn btn-sm btn-outline-dark" href="{{ post.url | relative_url }}">Прочети още</a>
          </div>
        </div>
      </div>
    </article>
    {% endfor %}

  </div>
</main>
