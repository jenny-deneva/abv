---
layout: default
---

<!-- PAGE HEADER (optional hero background) -->
<section class="position-relative d-flex flex-column justify-content-center text-center"
         style="min-height:28vh;
                background-image:url('{{ page.hero | default: '/assets/images/hero.jpg' | relative_url }}');
                background-size:cover;background-position:center;">
  <div class="position-absolute top-0 start-0 w-100 h-100" style="background:rgba(0,0,0,.45)"></div>
  <div class="container position-relative">
    <h1 class="display-5 fw-bold">{{ page.title }}</h1>
    <p class="mb-0 text-white-50">{{ page.date | date: "%-d %B %Y" }}</p>
  </div>
</section>

<main class="bg-light text-dark py-5">
  <div class="container">
    <!-- Featured image (optional) -->
    {% if page.image %}
    <figure class="mb-4">
      <img src="{{ page.image | relative_url }}" class="img-fluid rounded shadow-sm" alt="{{ page.title }}">
    </figure>
    {% endif %}

    <article class="fs-5">
      {{ content }}
    </article>
  </div>
</main>
