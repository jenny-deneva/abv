<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mom's Bookstore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet">
  <style>
    .hero {
      position: relative;
      background-image: url('https://picsum.photos/1600/800');
      background-size: cover;
      background-position: center;
      height: 100vh;
      color: white;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
    }
    .hero-text {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Mom's Bookstore</a>
    <div>
      <a class="nav-link d-inline text-white" href="#">Home</a>
      <a class="nav-link d-inline text-white" href="#">Books</a>
      <a class="nav-link d-inline text-white" href="#">Contact</a>
    </div>
  </div>
</nav>

<!-- Hero section -->
<div class="hero d-flex align-items-center justify-content-center text-center">
  <div class="overlay"></div>
  <div class="hero-text">
    <h1 class="display-3">Welcome to Mom's Bookstore</h1>
    <p class="lead">Celebrating books, stories, and community</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
