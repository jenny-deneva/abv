<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Книжарница АБВ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="text-white">

<!-- NAVBAR (≈100 px tall) -->
<nav class="navbar py-3" style="background-color:#5f0000;">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="#">
      <img src="https://web.archive.org/web/20250618061455im_/http://abvstore.eu/wp-content/uploads/2020/07/logo_responsive.png"
           alt="Logo" style="height:60px;">
    </a>
    <div>
      <a class="nav-link d-inline text-white fs-5" href="#">Начало&nbsp;</a>
      <a class="nav-link d-inline text-white fs-5" href="#">За нас&nbsp;</a>
      <a class="nav-link d-inline text-white fs-5" href="#">Новини</a>
    </div>
  </div>
</nav>

<!-- HERO (fills the viewport below the navbar) -->
<section class="position-relative d-flex flex-column justify-content-between text-center"
         style="height:calc(100vh - 102px);
                background-image:url('https://i.snipboard.io/08FgL1.jpg');
                background-size:cover; background-position:center;">

  <!-- dark overlay -->
  <div class="position-absolute top-0 start-0 w-100 h-100"
       style="background:rgba(0,0,0,0.4); z-index:0;"></div>

  <!-- centred headline -->
  <div class="container my-auto position-relative">
    <h1 class="display-3 fw-bold">Добре дошли в<br>Книжарница АБВ</h1>
    <p class="lead fw-normal">
      Художествена и детска литература, образователни игри, играчки и пъзели,<br class="d-none d-lg-block">
      учебни пособия и офис консумативи
    </p>
  </div>

  <!-- bottom feature boxes -->
  <div class="container position-relative pb-4">
    <div class="row g-3 text-center">
      <div class="col-6 col-md-3">
        <div class="p-3 bg-primary text-white rounded">
          <i class="bi bi-book fs-2 mb-2"></i><br>Литература
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="p-3 bg-success text-white rounded">
          <i class="bi bi-controller fs-2 mb-2"></i><br>Образователни игри и играчки
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="p-3 bg-warning text-white rounded">
          <i class="bi bi-pencil fs-2 mb-2"></i><br>Учебни пособия
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="p-3 bg-danger text-white rounded">
          <i class="bi bi-archive fs-2 mb-2"></i><br>Офис консумативи
        </div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
