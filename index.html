<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Книжарница АБВ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" 
    rel="stylesheet">
  <style>
    .hero {
      position: relative;
      background-image: url('https://i.snipboard.io/08FgL1.jpg');
      background-size: cover;
      background-position: center;
      height: calc(100vh - 100px);
      color: white;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
    }
    .hero-text {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .custom-navbar {
      background-color:rgba(95,0,0,255);
      height: 100px;
    }
    .custom-navbar .navbar-brand img {
      height: 60px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar custom-navbar">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="navbar-brand" href="#">
      <img src="https://web.archive.org/web/20250618061455im_/http://abvstore.eu/wp-content/uploads/2020/07/logo_responsive.png" alt="Logo">
    </a>
    <div>
      <a class="nav-link d-inline text-white fs-5" href="#">Начало &nbsp;</a>
      <a class="nav-link d-inline text-white fs-5" href="#">За нас &nbsp;</a>
      <a class="nav-link d-inline text-white fs-5" href="#">Новини</a>
    </div>
  </div>
</nav>

<!-- Hero section -->
<div class="hero d-flex flex-column align-items-center justify-content-start text-center pt-5">
  <div class="overlay"></div>
  <div class="hero-text">
    <h1 class="display-3">Добре дошли в <br> Книжарница АБВ</h1>
    <p class="lead">Художествена и детска литература, образователни игри, играчки и пъзели, учебни пособия и офис консумативи</p>
  </div>

  <div class="container position-absolute bottom-0 start-50 translate-middle-x mb-4">
    <div class="row text-center g-3">
        <div class="col-6 col-md-3">
            <div class="p-3 bg-primary text-white rounded">
            <div class="mb-2"><i class="bi bi-book fs-2"></i></div>
            Литература
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="p-3 bg-success text-white rounded">
            <div class="mb-2"><i class="bi bi-controller fs-2"></i></div>
            Образователни игри и играчки
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="p-3 bg-warning text-white rounded">
            <div class="mb-2"><i class="bi bi-pencil fs-2"></i></div>
            Учебни пособия
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="p-3 bg-danger text-white rounded">
            <div class="mb-2"><i class="bi bi-archive fs-2"></i></div>
            Офис консумативи
            </div>
        </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
