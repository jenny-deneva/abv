<meta charset="UTF-8">
<title>{{ page.title | default: site.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

{% if page.glightbox %}
<link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet">
{% endif %}

<style>
  body {
    padding-top: 100px;
  }

  /* space for fixed navbar */

  /* Used on index cards */
  .feature-img {
    height: 200px;
    object-fit: cover;
    width: 100%;
  }

  /* News list thumbnails: force-fit (ignore aspect ratio) */
  .news-thumb-box {
    --bs-aspect-ratio: 56.25%;
  }

  /* 16:9 area on desktop */
  .news-thumb {
    width: 100%;
    height: 100%;
    object-fit: fill;
    /* <-- stretch to fill, DOES NOT preserve aspect ratio */
    display: block;
    border-radius: .75rem;
    /* unified rounding; wrapper can also have rounded */
  }

  /* Shorter box on phones */
  @media (max-width: 767.98px) {
    .news-thumb-box {
      --bs-aspect-ratio: 45%;
    }
  }

  /* Post content media */
  .post-content img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 1rem auto;
    /* centers the image */
  }

  /* Optionally cap image width on large screens so they don't get huge */
  @media (min-width: 992px) {
    .post-content img {
      max-width: 800px;
    }
  }
</style>
