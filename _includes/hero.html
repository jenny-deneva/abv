<section class="position-relative d-flex flex-column justify-content-center text-center"
         style="min-height:{{ include.height | default: '28vh' }};
                background-image:url('{{ '/assets/images/hero.jpg' | relative_url }}');
                background-size:cover;background-position:center;">
  <div class="position-absolute top-0 start-0 w-100 h-100"
       style="background:rgba(0,0,0,0.4); z-index:0;"></div>

  <div class="container position-relative z-1">
    <h1 class="display-3 fw-bold">
      {{ include.title }}{% if include.title_line2 %}<br>{{ include.title_line2 }}{% endif %}
    </h1>
    {% if include.subtitle %}<p class="lead mb-0">{{ include.subtitle }}</p>{% endif %}
  </div>
</section>
